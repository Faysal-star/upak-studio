; DeskPet base firmware — ST7789 240x240 SPI on ESP32-S3
;
;   pio run -e esp32s3               build for ESP32-S3-DevKitC-1
;   pio run -e esp32s3 -t upload     flash firmware
;   pio run -e esp32s3 -t uploadfs   flash data/ (demo.dpak, face.dpak) to the assets partition
;   pio device monitor -e esp32s3    serial monitor, 115200
;   pio test -e native               host-side unit tests (DPAK decoder, face engine, HAL, game)
;
; esp32s3      -> Serial on the board's "UART" port (CP2102).
; esp32s3-usb  -> Serial on the board's "USB" port (native USB-Serial-JTAG,
;                 driverless — use for Web Serial / studio "Send to device").

[device]
platform = espressif32@7.0.1
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs
lib_deps =
    ; pinned: 1.2.28 is the version validated on real hardware (2026-08-29)
    lovyan03/LovyanGFX@1.2.28
build_flags =
    -DCORE_DEBUG_LEVEL=1

[env:esp32s3]
extends = device
board = esp32-s3-devkitc-1
board_build.partitions = partitions_s3_8mb.csv
; If your WROOM-1 marking ends in R2/R8 (has PSRAM), you may add:
;   build_flags = ${device.build_flags} -DBOARD_HAS_PSRAM
; (quad PSRAM only; octal R8 also needs board_build.arduino.memory_type = qio_opi)
; Not required — the frame buffer fits internal RAM on the S3.

[env:esp32s3-usb]
extends = env:esp32s3
build_flags =
    ${device.build_flags}
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

[env:native]
platform = native
test_framework = unity
build_flags = -O2 -Wall -Wextra
